name: test-deploy

on:
  push:
    branches: [main, deploy/prod]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Worker syntax check
        run: node --check worker/worker.js
      - name: Feature-preservation guard
        run: node tests/feature-guard.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parser unit tests
        working-directory: parser
        run: python3 -m unittest test_hkparse -v

  deploy:
    name: Deploy cbum-chart worker
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/deploy/prod'
    steps:
      - uses: actions/checkout@v4
      - name: Upload worker.js (fetch-merge settings, multipart PUT)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: bash ci/deploy.sh

  smoke:
    name: Live smoke check
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Poll live worker for marker strings + /v
        env:
          SMOKE_K: ${{ secrets.SMOKE_K }}
          SMOKE_BASE: ${{ secrets.SMOKE_BASE }}
        run: bash ci/smoke.sh
